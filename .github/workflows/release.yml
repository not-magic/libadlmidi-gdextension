name: Release

# Builds template_debug + template_release for linux/windows/macos, then
# packages demo/addons/ADLMIDI/ (source-free, binaries for every platform
# included) into a zip attached to a GitHub Release. That zip is what's
# meant to be distributed -- either linked directly, or used as the
# "Custom" download URL in a Godot Asset Library submission, since the
# Asset Library's GitHub-commit-based download can't include build output
# that (deliberately) isn't committed to the repo.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install SCons
        run: pip install scons

      # ilammy/msvc-dev-cmd is unmaintained and stuck on the Node.js 20
      # runtime GitHub removed; vs-shell does the same job as a plain
      # PowerShell composite action, so it has no Node runtime to deprecate.
      - name: Set up MSVC
        if: matrix.platform == 'windows'
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - name: Cache SCons build
        uses: actions/cache@v6
        with:
          path: .scons_cache
          key: scons-release-${{ matrix.platform }}-${{ hashFiles('src/**', 'SConstruct', 'extension_api.json') }}
          restore-keys: |
            scons-release-${{ matrix.platform }}-

      - name: Build template_debug
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons_cache
        run: scons platform=${{ matrix.platform }} target=template_debug -j4

      - name: Build template_release
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons_cache
        run: scons platform=${{ matrix.platform }} target=template_release -j4

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: adlmidi-bin-${{ matrix.platform }}
          path: demo/addons/ADLMIDI/bin/

  package:
    name: Package addon
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download binaries for every platform
        uses: actions/download-artifact@v8
        with:
          pattern: adlmidi-bin-*
          path: demo/addons/ADLMIDI/bin
          merge-multiple: true

      - name: Zip addon
        run: |
          cp LICENSE demo/addons/ADLMIDI/LICENSE
          cd demo/addons
          zip -r "${{ github.workspace }}/ADLMIDI.zip" ADLMIDI

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: ADLMIDI.zip
          generate_release_notes: true
