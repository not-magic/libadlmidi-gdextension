name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install SCons
        run: pip install scons

      - name: Set up MSVC
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache SCons build
        uses: actions/cache@v4
        with:
          path: .scons_cache
          key: scons-ci-${{ matrix.platform }}-${{ hashFiles('src/**', 'SConstruct', 'extension_api.json') }}
          restore-keys: |
            scons-ci-${{ matrix.platform }}-

      # Builds the extension and runs the standalone (no godot-cpp) tests in
      # tests/ in one pass. template_debug only: this is a compile/test
      # sanity check, not a release build (see release.yml for that).
      - name: Build and test
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons_cache
        run: scons platform=${{ matrix.platform }} target=template_debug tests=yes run_tests=yes -j4
